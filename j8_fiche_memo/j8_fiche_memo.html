(function(){
  var q = new URLSearchParams(location.search);
  var f = (q.get('f')||'').trim(), s = (q.get('s')||'').trim();
  var ident = f ? (f + (s ? ' · ' + s : '')) : 'Exemplaire non nominatif';
  document.getElementById('nom').textContent = ident;
  document.getElementById('coin').textContent = ident + ' — © TMK Performances';
  document.getElementById('menu').href = '../' + location.search;

  // filigrane diagonal répété, reconstruit à partir du nom
  var t = (f ? f : 'TMK PERFORMANCES') + (s ? '  ' + s : '');
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="420" height="240">' +
            '<text x="0" y="150" transform="rotate(-28 0 150)" fill="%23000" ' +
            'fill-opacity="0.055" font-family="Helvetica,Arial" font-size="26">' +
            t.replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</text></svg>';
  document.getElementById('fg').style.background =
    'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg).replace(/'/g,"%27") + '")';

  var vue = document.getElementById('vue'), cur = document.getElementById('cur');
  var note = document.getElementById('note'), bas = document.getElementById('bas');
  var i = 0, vigs = [];

  DATA.forEach(function(d, k){
    var v = document.createElement('div'); v.className = 'vig';
    var im = document.createElement('img'); im.src = d.img; im.alt = '';
    var b = document.createElement('b'); b.textContent = k + 1;
    v.appendChild(im); v.appendChild(b);
    v.addEventListener('click', function(){ aller(k); });
    bas.appendChild(v); vigs.push(v);
  });

  function aller(k){
    i = Math.min(Math.max(0, k), DATA.length - 1);
    vue.src = DATA[i].img; vue.alt = 'Page ' + (i + 1); cur.textContent = i + 1;
    note.innerHTML = DATA[i].note
      ? DATA[i].note.split('\n').filter(function(l){return l.trim();})
          .map(function(l){return '<p>' + l + '</p>';}).join('')
      : '<p class="aucune">Pas de note sur cette page.</p>';
    vigs.forEach(function(v, k2){ v.classList.toggle('on', k2 === i); });
    vigs[i].scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
  }

  document.getElementById('nd').addEventListener('click', function(){ aller(i + 1); });
  document.getElementById('ng').addEventListener('click', function(){ aller(i - 1); });
  document.getElementById('bnotes').addEventListener('click', function(){
    document.body.classList.toggle('sansnotes');
  });
  document.getElementById('bplein').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { aller(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { aller(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') aller(0);
    else if (e.key === 'End') aller(DATA.length - 1);
    else if (e.key === 'p' || e.key === 'P') document.body.classList.toggle('sansnotes');
    else if (e.key === 'f' || e.key === 'F') document.getElementById('bplein').click();
  });
  document.addEventListener('copy', function(e){ e.preventDefault(); });
  aller(0);
})();
</script>
