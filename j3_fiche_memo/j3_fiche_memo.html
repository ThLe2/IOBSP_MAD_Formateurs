         padding:14px 16px;overflow-y:auto;font-size:13.5px;line-height:1.6;}

  .pied{position:fixed;left:0;right:0;bottom:0;height:0;overflow:hidden;}
  #imp{display:none;}

  document.getElementById('nd').addEventListener('click', function(){ aller(i + 1); });
  document.getElementById('ng').addEventListener('click', function(){ aller(i - 1); });
  document.getElementById('bnotes').addEventListener('click', function(){
    document.body.classList.toggle('sansnotes');
  });
  document.getElementById('bplein').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { aller(i + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { aller(i - 1); e.preventDefault(); }
    else if (e.key === 'Home') aller(0);
    else if (e.key === 'End') aller(DATA.length - 1);
    else if (e.key === 'p' || e.key === 'P') document.body.classList.toggle('sansnotes');
    else if (e.key === 'f' || e.key === 'F') document.getElementById('bplein').click();
  });
  document.addEventListener('copy', function(e){ e.preventDefault(); });
  aller(0);
})();
</script>
</body>
</html>
