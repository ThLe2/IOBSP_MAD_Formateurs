<style>

         background:#fff;border:1px solid var(--trame);border-radius:8px;overflow:hidden;}

  .fg{position:absolute;inset:0;pointer-events:none;}
  .coin{position:absolute;right:10px;bottom:8px;font-size:11px;color:rgba(92,19,73,.55);

  .nav{position:absolute;top:0;bottom:0;width:14%;cursor:pointer;opacity:0;}
  .nav.g{left:0;} .nav.d{right:0;}

  .notes{width:330px;background:#fff;border:1px solid var(--trame);border-radius:8px;
         padding:14px 16px;overflow-y:auto;font-size:13.5px;line-height:1.6;}

  .notes .aucune{color:var(--gris-m);font-style:italic;}
  body.sansnotes .notes{display:none;}

  .bas{height:92px;border-top:1px solid var(--trame);background:#fff;
       display:flex;align-items:center;gap:8px;padding:8px 14px;overflow-x:auto;}
  .vig{flex:0 0 auto;border:2px solid transparent;border-radius:5px;overflow:hidden;
       cursor:pointer;position:relative;background:var(--prune-c);line-height:0;}
  .vig img{height:62px;width:auto;display:block;}
  .vig b{position:absolute;left:0;bottom:0;background:rgba(94,19,73,.85);color:#fff;
         font-size:10px;padding:1px 5px;border-radius:0 4px 0 4px;line-height:1.4;}
  .vig.on{border-color:var(--prune);}

  .pied{position:fixed;left:0;right:0;bottom:0;height:0;overflow:hidden;}
  #imp{display:none;}
  @media print{
